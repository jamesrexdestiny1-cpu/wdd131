<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore temples of The Church of Jesus Christ of Latter-day Saints. Filter temples by dedication date and building size.">

    <meta name="author" content="James Rex Ovie">

    <title>Filtered Temple Album | WDD 131</title>

    <!-- Connect to Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Link the new CSS files. -->
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">

    <!-- Load the new JavaScript file. -->
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">

            <span class="site-title">Temple Album</span>

            <!-- Mobile navigation button. -->
            <button
                id="menu-button"
                class="menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="navigation">

                <span id="menu-icon" aria-hidden="true">&#9776;</span>
            </button>

            <!-- Main navigation and temple filters. -->
            <nav id="navigation" class="navigation"
                aria-label="Main navigation">

                <a href="#" class="nav-link active" data-filter="all">Home</a>
                <a href="#" class="nav-link" data-filter="old">Old</a>
                <a href="#" class="nav-link" data-filter="new">New</a>
                <a href="#" class="nav-link" data-filter="large">Large</a>
                <a href="#" class="nav-link" data-filter="small">Small</a>

            </nav>
        </div>
    </header>

    <main>

        <h1>Temple Album</h1>

        <!-- JavaScript updates this message after filtering. -->
        <p id="temple-count" class="temple-count" aria-live="polite">
            Loading temples...
        </p>

        <!-- JavaScript generates all temple cards inside this section. -->
        <section
            id="temple-gallery"
            class="temple-gallery"
            aria-label="Temple picture gallery"
            aria-live="polite">

        </section>

    </main>

    <footer>

        <p>
            &copy;<span id="currentyear"></span>
            James Rex Ovie
            <span class="footer-separator">|</span>
            Nigeria
        </p>

        <p id="lastModified"></p>

    </footer>

</body>
</html>
