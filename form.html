
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines the character encoding used by the document. -->
    <meta charset="UTF-8">

    <!-- Ensures the page displays correctly on mobile and desktop screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Provides a description of the page for search engines. -->
    <meta name="description" content="Submit a product review by selecting a product, providing a rating, and sharing your experience.">

    <!-- Identifies the author of this webpage. -->
    <meta name="author" content="James Rex Ovie">

    <!-- Sets the title displayed in the browser tab. -->
    <title>Product Review Form | WDD 131</title>

    <!-- Connects the external CSS file responsible for styling this page. -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- Loads the JavaScript file that dynamically populates the product dropdown. -->
    <script src="scripts/form.js" defer></script>

</head>

<body>

    <!-- The header introduces the purpose of the webpage. -->
    <header>
        <h1>Product Review</h1>
    </header>

    <!-- The main element contains the primary content of the webpage. -->
    <main>

        <!-- The form collects product review information from the visitor. -->
        <!-- GET sends the submitted information to review.html through the URL. -->
        <form method="get" action="review.html">

            <!-- Product selection section. -->
            <div class="form-group">

                <!-- The label identifies the product selection field. -->
                <label for="product">
                    Product Name
                    <span class="required-indicator" aria-hidden="true">*</span>
                </label>

                <!-- The required select element receives its options from JavaScript. -->
                <select id="product" name="product" required>

                    <!-- This placeholder appears first and cannot be selected as a valid answer. -->
                    <option value="" disabled selected>Select a Product ...</option>

                    <!-- JavaScript inserts the available product options here. -->

                </select>

            </div>

            <!-- Overall product rating section. -->
            <fieldset class="form-group rating-group">

                <!-- The legend describes the purpose of the radio button group. -->
                <legend>
                    Overall Rating
                    <span class="required-indicator" aria-hidden="true">*</span>
                </legend>

                <!-- Each radio button shares the same name to allow only one rating. -->
                <div class="rating-options">

                    <!-- First rating option: one star. -->
                    <label for="rating1">
                        <span class="star-display">★</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span class="rating-text">1</span>
                    </label>

                    <!-- Second rating option: two stars. -->
                    <label for="rating2">
                        <span class="star-display">★★</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span class="rating-text">2</span>
                    </label>

                    <!-- Third rating option: three stars. -->
                    <label for="rating3">
                        <span class="star-display">★★★</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span class="rating-text">3</span>
                    </label>

                    <!-- Fourth rating option: four stars. -->
                    <label for="rating4">
                        <span class="star-display">★★★★</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span class="rating-text">4</span>
                    </label>

                    <!-- Fifth rating option: five stars. -->
                    <label for="rating5">
                        <span class="star-display">★★★★★</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span class="rating-text">5</span>
                    </label>

                </div>

            </fieldset>

            <!-- Product installation date section. -->
            <div class="form-group">

                <!-- The label identifies the installation date field. -->
                <label for="installDate">
                    Date of Installation
                    <span class="required-indicator" aria-hidden="true">*</span>
                </label>

                <!-- The date input allows users to select the installation date. -->
                <input type="date" id="installDate" name="installDate" required>

            </div>

            <!-- Useful product features section. -->
            <fieldset class="form-group features-group">

                <!-- The legend introduces the checkbox options. -->
                <legend>
                    Which features did you find useful in the product?
                    <span class="optional-indicator">(Check all that apply)</span>
                </legend>

                <!-- Each checkbox allows the visitor to select an applicable feature. -->
                <div class="checkbox-options">

                    <!-- Durability feature checkbox. -->
                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>

                    <!-- Ease of use feature checkbox. -->
                    <label for="ease">
                        <input type="checkbox" id="ease" name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <!-- Performance feature checkbox. -->
                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>

                    <!-- Design feature checkbox. -->
                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>

                </div>

            </fieldset>

            <!-- Optional written review section. -->
            <div class="form-group">

                <!-- The label identifies the written review field. -->
                <label for="writtenReview">
                    Written Review
                    <span class="optional-indicator">(Optional)</span>
                </label>

                <!-- The textarea allows visitors to provide additional comments. -->
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>

            </div>

            <!-- Optional visitor name section. -->
            <div class="form-group">

                <!-- The label identifies the visitor name field. -->
                <label for="userName">
                    Your Name
                    <span class="optional-indicator">(Optional)</span>
                </label>

                <!-- The text input collects the visitor's name. -->
                <input type="text" id="userName" name="userName" autocomplete="name">

            </div>

            <!-- The submit input sends the completed form to review.html. -->
            <div class="form-group submit-group">

                <!-- The button clearly communicates the purpose of submission. -->
                <input type="submit" value="Post Review">

            </div>

        </form>

    </main>

    <!-- The footer contains copyright and automatic modification details. -->
    <footer>

        <p>
            &copy;<span id="currentyear"></span>
            James Rex Ovie
            <span class="footer-separator">|</span>
            Nigeria
        </p>

        <!-- JavaScript inserts the document's last-modified date here. -->
        <p id="lastModified"></p>

    </footer>

</body>

</html>
