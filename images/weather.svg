
<!-- Original SVG illustration representing partly cloudy weather. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

    <!-- Yellow circle representing the sun. -->
    <circle
        cx="35"
        cy="35"
        r="18"
        fill="#f5b82e"/>

    <!-- Blue cloud shape placed in front of the sun. -->
    <path
        d="M28 72h45a15 15 0 0 0 0-30 22 22 0 0 0-42-4 17 17 0 0 0-3 34z"
        fill="#8bb8d9"/>

</svg>
